[project]
name = "coding-training"
version = "0.1.0"
description = "Execution-Verified Coding Model Training Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/contracts",
    "packages/datasets",
    "packages/artifacts",
    "packages/evaluation",
    "packages/telemetry",
    "services/rewards",
    "services/controller",
    "services/model",
    "services/sandbox_worker",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "datasets",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
