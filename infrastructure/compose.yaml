# ai-lab control plane — code-complete, not deployed.
# Default bind is loopback. Set AI_LAB_BIND_ADDRESS to a Tailscale IPv4 at deploy time.
# Do not publish on every interface.

name: ai-lab-control

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
    ports:
      - "${AI_LAB_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ai_lab_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_lab} -d ${POSTGRES_DB:-ai_lab}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "${AI_LAB_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ai_lab_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    cpus: 0.50

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    ports:
      - "${AI_LAB_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${AI_LAB_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ai_lab_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 1.0

volumes:
  ai_lab_pgdata:
  ai_lab_redis:
  ai_lab_qdrant:
