<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ai-lab · agents</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/chrome.css">
  <style>
    :root {
      --bg: #0c1014; --panel: #141b22; --line: #243040; --ink: #e8eef6;
      --muted: #8ea0b5; --live: #3ee0a8; --warn: #e8b45c; --down: #ff6b7a; --accent: #7cb8ff;
      --user: #1a2838; --assistant: #121820;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      color: var(--ink);
      font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      display: flex; flex-direction: column;
    }
    .shell {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px 12px;
      align-items: end;
      padding: 14px 0 10px;
      border-bottom: 1px solid var(--line);
    }
    .toolbar .field { min-width: 0; flex: 1 1 120px; }
    .toolbar .field.narrow { flex: 0 1 110px; }
    label { display: block; font-size: 11px; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
    select, textarea, button, input {
      font: inherit; color: var(--ink); background: #0c1218;
      border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    }
    select, input { width: 100%; }
    .pill {
      display: inline-block; font: 11px/1 ui-monospace, Menlo, monospace;
      padding: 7px 10px; border-radius: 999px; background: #0c1218; color: var(--muted);
      border: 1px solid var(--line); margin-bottom: 1px;
    }
    .pill.local { color: var(--live); }
    .pill.usage_billed_api { color: var(--warn); }
    .pill.subscription_client { color: var(--accent); }
    button {
      cursor: pointer;
      background: color-mix(in srgb, var(--accent) 22%, #0c1218);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
      white-space: nowrap;
    }
    button.primary {
      background: var(--accent); color: #061018; font-weight: 650; border-color: transparent;
    }
    button.danger {
      background: color-mix(in srgb, var(--down) 18%, #0c1218);
      border-color: color-mix(in srgb, var(--down) 35%, var(--line));
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .thread {
      overflow-y: auto; padding: 18px 0 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .empty {
      margin: auto; text-align: center; color: var(--muted); max-width: 28rem;
      padding: 40px 12px;
    }
    .empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; font-weight: 600; }
    .bubble {
      max-width: 88%; padding: 10px 14px; border-radius: 14px;
      border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end; background: var(--user);
      border-bottom-right-radius: 4px;
    }
    .bubble.assistant, .bubble.system, .bubble.tool {
      align-self: flex-start; background: var(--assistant);
      border-bottom-left-radius: 4px;
    }
    .bubble .who {
      font: 10px/1 ui-monospace, Menlo, monospace;
      letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .composer {
      padding: 10px 0 16px;
      border-top: 1px solid var(--line);
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
    }
    .composer textarea {
      width: 100%; min-height: 52px; max-height: 160px; resize: vertical;
    }
    .side {
      max-width: 820px; width: 100%; margin: 0 auto; padding: 0 16px 28px;
    }
    details.loop {
      border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      padding: 0 14px;
    }
    details.loop > summary {
      cursor: pointer; list-style: none; padding: 12px 0;
      color: var(--muted); font-size: 13px;
    }
    details.loop > summary::-webkit-details-marker { display: none; }
    details.loop[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .loop .row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-bottom: 10px; }
    .trace {
      font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap;
      background: #0c1218; padding: 10px; border-radius: 8px; margin-top: 8px;
    }
    .muted { color: var(--muted); font-size: 13px; }
    .err { color: var(--down); font-size: 13px; padding: 0 0 8px; min-height: 1.2em; }
    .auth-slim {
      max-width: 820px; margin: 0 auto; padding: 8px 16px 0;
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end;
    }
    @media (max-width: 640px) {
      .toolbar .field { flex: 1 1 45%; }
      .bubble { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="auth-slim" data-auth-panel>
    <div>
      <label for="token">Lab API bearer token</label>
      <input id="token" type="password" autocomplete="off" placeholder="only if not on Tailscale">
    </div>
    <button type="button" id="save-token">Save</button>
  </div>

  <div class="shell">
    <div class="toolbar">
      <div class="field">
        <label for="agent">Agent</label>
        <select id="agent">
          <option value="lab-operations">lab-operations</option>
          <option value="development">development</option>
          <option value="research">research</option>
        </select>
      </div>
      <div class="field">
        <label for="provider">Provider</label>
        <select id="provider"></select>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div class="field narrow">
        <label>Billing</label>
        <div id="billing" class="pill">—</div>
      </div>
      <button type="button" id="new-conv">New chat</button>
    </div>

    <div id="messages" class="thread" aria-live="polite">
      <div class="empty" id="empty">
        <strong>Talk to a lab agent</strong>
        Studio Ollama when selected — ordinary chat, not a durable work order.
      </div>
    </div>

    <div class="composer">
      <div>
        <label for="chat" class="muted" id="conv-id">No conversation yet</label>
        <textarea id="chat" rows="2" placeholder="Message…"></textarea>
      </div>
      <button type="button" class="primary" id="send-chat">Send</button>
    </div>
  </div>

  <div class="side">
    <p class="err" id="error"></p>
    <details class="loop">
      <summary>Agent loop — tools, approvals, durable run</summary>
      <div class="row2">
        <div>
          <label for="objective">Objective</label>
          <textarea id="objective" rows="2" placeholder="e.g. check lab health with tools">Check lab health using tools, then summarize.</textarea>
        </div>
        <button type="button" id="start-run">Run loop</button>
      </div>
      <div id="run-view" class="trace" hidden></div>
      <div id="pending" hidden style="margin-top:12px">
        <p class="muted">Pending tool action:</p>
        <div id="pending-detail" class="trace"></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button type="button" id="approve-action">Approve</button>
          <button type="button" class="danger" id="deny-action">Deny</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;padding-bottom:12px">
        <button type="button" id="cancel-run">Cancel</button>
        <button type="button" id="retry-run">Retry</button>
      </div>
    </details>
  </div>

  <script>
    const state = { conversationId: null, runId: null, pendingActionId: null, providers: [], sending: false };
    const $ = (id) => document.getElementById(id);
    function token() { return sessionStorage.getItem("ai_lab_token") || ($("token") && $("token").value.trim()) || ""; }
    function headers() {
      const h = Object.assign({ "Content-Type": "application/json" }, window.aiLabHeaders ? window.aiLabHeaders() : {});
      if (!h.Authorization) {
        const t = token();
        if (t) h.Authorization = `Bearer ${t}`;
      }
      return h;
    }
    function showErr(e) { $("error").textContent = e ? String(e) : ""; }
    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
      const text = await res.text();
      let body; try { body = JSON.parse(text); } catch { body = { raw: text }; }
      if (!res.ok) {
        const detail = body.detail;
        throw new Error(typeof detail === "string" ? detail : (body.raw || res.statusText));
      }
      return body;
    }
    function renderBilling() {
      const p = state.providers.find((x) => x.id === $("provider").value);
      const pill = $("billing");
      if (!p) { pill.textContent = "—"; pill.className = "pill"; return; }
      pill.textContent = p.billing_class;
      pill.className = "pill " + p.billing_class;
    }
    function fillModels() {
      const p = state.providers.find((x) => x.id === $("provider").value);
      const msel = $("model");
      msel.innerHTML = "";
      const models = (p && p.models && p.models.length) ? p.models : ["fake-instruct"];
      for (const m of models) {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = m;
        msel.appendChild(opt);
      }
      if (p && p.id === "ollama") {
        const preferred = models.find((m) => m.includes("llama3.2"));
        if (preferred) msel.value = preferred;
      }
    }
    async function loadProviders() {
      const data = await api("/v1/models");
      state.providers = data.providers || [];
      const sel = $("provider");
      sel.innerHTML = "";
      for (const p of state.providers) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.id + (p.enabled ? "" : " (off)");
        opt.disabled = !p.enabled && p.id !== "fake";
        sel.appendChild(opt);
      }
      if (![...sel.options].some((o) => o.value === "fake")) {
        const opt = document.createElement("option");
        opt.value = "fake"; opt.textContent = "fake";
        sel.appendChild(opt);
      }
      const ollama = state.providers.find((p) => p.id === "ollama" && p.enabled);
      sel.value = ollama ? "ollama" : "fake";
      fillModels();
      renderBilling();
      sel.onchange = () => { fillModels(); renderBilling(); };
    }
    function renderMessages(list) {
      const box = $("messages");
      box.innerHTML = "";
      if (!list || !list.length) {
        box.innerHTML = '<div class="empty" id="empty"><strong>Talk to a lab agent</strong>Studio Ollama when selected — ordinary chat, not a durable work order.</div>';
        return;
      }
      for (const m of list) {
        const el = document.createElement("div");
        el.className = "bubble " + (m.role || "assistant");
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = m.role + (m.meta && m.meta.backend ? " · " + m.meta.backend : "");
        const body = document.createElement("div");
        body.textContent = m.content || "";
        el.appendChild(who);
        el.appendChild(body);
        box.appendChild(el);
      }
      box.scrollTop = box.scrollHeight;
    }
    async function refreshMessages() {
      if (!state.conversationId) { renderMessages([]); return; }
      const data = await api(`/v1/conversations/${state.conversationId}/messages`);
      renderMessages(data.messages || []);
    }
    async function newConversation() {
      const body = await api("/v1/conversations", {
        method: "POST",
        body: JSON.stringify({ agent: $("agent").value, title: "ui" }),
      });
      state.conversationId = body.id;
      state.runId = null;
      $("conv-id").textContent = "Chat " + body.id.slice(0, 8);
      $("run-view").hidden = true;
      $("pending").hidden = true;
      renderMessages([]);
    }
    function summarizeRun(run) {
      const lines = [];
      lines.push(`status: ${run.status} · backend: ${run.backend || "?"} · model: ${run.model || "?"}`);
      if (run.error) lines.push(`error: ${run.error}`);
      if (run.final_result) lines.push(`final: ${run.final_result}`);
      for (const t of run.traces || []) {
        if (t.kind === "model_call") {
          const preview = (t.text || "").replace(/\s+/g, " ").slice(0, 120);
          lines.push(`model → ${preview}`);
        } else if (t.kind === "tool_result") {
          const obs = (t.observation || "").replace(/\s+/g, " ").slice(0, 160);
          lines.push(`tool ${t.tool} ${t.ok ? "ok" : "fail"} → ${obs}`);
        } else if (t.kind === "tool_denied") {
          lines.push(`denied ${t.tool}: ${t.reason || ""}`);
        } else if (t.kind === "approval_required") {
          lines.push(`needs approval: ${t.tool}`);
        } else if (t.kind === "final") {
          lines.push(`done: ${(t.text || "").slice(0, 160)}`);
        }
      }
      return lines.join("\n");
    }
    function renderRun(run) {
      state.runId = run.id;
      document.querySelector("details.loop").open = true;
      $("run-view").hidden = false;
      $("run-view").textContent = summarizeRun(run);
      if (run.pending_action) {
        state.pendingActionId = run.pending_action.id;
        $("pending").hidden = false;
        $("pending-detail").textContent = JSON.stringify(run.pending_action, null, 2);
      } else {
        state.pendingActionId = null;
        $("pending").hidden = true;
      }
    }
    $("save-token").onclick = () => {
      sessionStorage.setItem("ai_lab_token", $("token").value.trim());
      showErr("");
      loadProviders().catch((e) => showErr(e));
    };
    $("new-conv").onclick = () => newConversation().catch((e) => showErr(e));
    $("chat").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        $("send-chat").click();
      }
    });
    $("send-chat").onclick = async () => {
      const text = $("chat").value.trim();
      if (!text || state.sending) return;
      state.sending = true;
      $("send-chat").disabled = true;
      try {
        if (!state.conversationId) await newConversation();
        $("chat").value = "";
        // Optimistic user bubble
        const empty = $("empty");
        if (empty) empty.remove();
        const optimistic = document.createElement("div");
        optimistic.className = "bubble user";
        optimistic.innerHTML = '<div class="who">user</div>';
        const body = document.createElement("div");
        body.textContent = text;
        optimistic.appendChild(body);
        $("messages").appendChild(optimistic);
        $("messages").scrollTop = $("messages").scrollHeight;

        const resp = await api(`/v1/conversations/${state.conversationId}/messages`, {
          method: "POST",
            body: JSON.stringify({
            content: text,
            role: "user",
            reply: true,
            backend: $("provider").value || "fake",
            model: $("model").value || "fake-instruct",
          }),
        });
        if (resp.error) showErr(resp.error);
        else showErr("");
        await refreshMessages();
      } catch (e) { showErr(e); }
      finally {
        state.sending = false;
        $("send-chat").disabled = false;
        $("chat").focus();
      }
    };
    $("start-run").onclick = async () => {
      try {
        if (!state.conversationId) await newConversation();
        const backend = $("provider").value || "fake";
        const p = state.providers.find((x) => x.id === backend);
        const run = await api(`/v1/conversations/${state.conversationId}/runs`, {
          method: "POST",
          body: JSON.stringify({
            objective: $("objective").value.trim() || "Check lab health using tools, then summarize.",
            model: $("model").value || "fake-instruct",
            billing_class: (p && p.billing_class) || "local",
            backend,
            execute: true,
            max_steps: 8,
          }),
        });
        renderRun(run);
        showErr("");
      } catch (e) { showErr(e); }
    };
    $("approve-action").onclick = async () => {
      try {
        renderRun(await api(`/v1/agent-runs/${state.runId}/approve-action`, {
          method: "POST",
          body: JSON.stringify({ decision: "approved", action_id: state.pendingActionId }),
        }));
      } catch (e) { showErr(e); }
    };
    $("deny-action").onclick = async () => {
      try {
        renderRun(await api(`/v1/agent-runs/${state.runId}/approve-action`, {
          method: "POST",
          body: JSON.stringify({ decision: "denied", action_id: state.pendingActionId }),
        }));
      } catch (e) { showErr(e); }
    };
    $("cancel-run").onclick = async () => {
      if (!state.runId) return;
      try { renderRun(await api(`/v1/agent-runs/${state.runId}/cancel`, { method: "POST", body: "{}" })); }
      catch (e) { showErr(e); }
    };
    $("retry-run").onclick = async () => {
      if (!state.runId) return;
      try { renderRun(await api(`/v1/agent-runs/${state.runId}/retry`, { method: "POST", body: "{}" })); }
      catch (e) { showErr(e); }
    };
    if ($("token")) $("token").value = sessionStorage.getItem("ai_lab_token") || "";
    function boot() { loadProviders().catch(() => {}); }
    document.addEventListener("ai-lab-auth-ready", boot);
    boot();
  </script>
  <script src="/static/chrome.js"></script>
</body>
</html>
