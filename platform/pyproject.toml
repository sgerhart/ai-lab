[project]
name = "ai-lab-platform"
version = "0.2.0"
description = "ai-lab control plane: work orders, LangGraph slice, FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141",
  "uvicorn>=0.53",
  "httpx>=0.28",
  "python-multipart>=0.0.9",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.1",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_lab_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
